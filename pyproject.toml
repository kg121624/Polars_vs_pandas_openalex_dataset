[project]
name = "polars-vs-pandas-openalex"
version = "0.1.0"
description = "Warsztat: ekstrakcja i analiza danych OpenAlex w Polars, Pandas i SQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "polars>=1.5",
    "pandas>=2.2",
    "pandasql>=0.7.3",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
